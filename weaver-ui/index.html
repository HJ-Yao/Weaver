<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <link rel="icon" href="/brand/weaver-logo.png" />
    <title>Weaver — Agent Harness</title>
    <script>
      // 首屏渲染前应用已持久化的主题，否则会先闪现默认的深色背景。
      try {
        const theme = localStorage.getItem('weaver.theme');
        const accent = localStorage.getItem('weaver.accent');
        if (theme) document.documentElement.dataset.theme = theme;
        if (accent) document.documentElement.dataset.accent = accent;
      } catch (error) {
        // 隐私模式等场景可能无法访问存储；此时回退到默认主题即可。
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
